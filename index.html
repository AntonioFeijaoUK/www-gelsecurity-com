<!DOCTYPE html>
<html>

<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body,
    html {
      height: 100%;
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      flex-direction: column;
    }

    .bg {
      /* The image used */
      background-image: url("/images/w-secret-rc-xyz-nft-gallery-eNxYF6cexYU-unsplash-small.jpg");

      /* Full height */
      flex: 1;
      position: relative;

      /* Center and scale the image nicely */
      background-position: center;
      background-repeat: no-repeat;
      background-size: cover;
    }

    .centre-text {
      text-align: center;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: white;
    }

    footer {
      text-align: center;
      background-color: rgba(0, 0, 0, 0.5);
      color: white;
      padding: 10px 0;
    }
  </style>
</head>

<body>
  <div class="bg">
    <div class="centre-text">
      <h1 style="font-size:50px">Gel Security</h1>
      <p>Can you find the message?</p>

      <h2>This is a demo website and login form!</h2>
      <form action="/login" method="POST">
        <input type="text" placeholder="username" />
        <input type="password" placeholder="password" />
        <div class="cf-turnstile" data-sitekey="0x4AAAAAAAf0FyMdm_H6AFYJ"></div>
        <button type="submit" value="Submit">Log in</button>
      </form>

      <h2>Demo insecure login form!</h2>
       <form id="loginForm" method="GET">
        <input id="username" name="username" type="text" placeholder="username" />
        <input id="password" name="password" type="password" placeholder="password" />
         <div class="cf-turnstile" data-sitekey="0x4AAAAAAAf0FyMdm_H6AFYJ"></div>
        <button type="submit" value="Submit">Log in</button>
      </form>
      
    </div>
  </div>

  <footer>
    <p>Original photo <a href="https://unsplash.com/photos/a-close-up-of-a-metal-object-with-numbers-on-it-eNxYF6cexYU" style="color: white;">Unsplash</a></p>
  </footer>

 <script>
    // JavaScript to dynamically set the form action URL
    const form = document.getElementById('loginForm');
    form.onsubmit = function (event) {
      event.preventDefault(); // Prevent default form submission
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const url = `https://www.hackerclub.com/login/${username}-${password}`; // Construct the URL
      window.location.href = url; // Redirect to the constructed URL
    };
  </script>

  
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" defer></script>
</body>

</html>
