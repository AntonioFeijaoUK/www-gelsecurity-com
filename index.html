<!DOCTYPE html>
<html>

<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body,
    html {
      height: 100%;
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
    }

    .bg {
      /* The image used */
      background-image: url("/images/w-secret-rc-xyz-nft-gallery-eNxYF6cexYU-unsplash-small.jpg");

      /* Full height */
      height: 100%;

      /* Center and scale the image nicely */
      background-position: center;
      background-repeat: no-repeat;
      background-size: cover;
    }

    .centre-text {
      text-align: center;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: white;
    }
  </style>
</head>

<body>

  <div class="bg"></div>

  <div class="centre-text">
    <h1 style="font-size:50px">Gel Security</h1>
    <p>Can you find the message?</p>
  </div>

  <h2>This is a demo website!</h2>
  <form action="/login" method="POST">
    <input type="text" placeholder="username" />
    <input type="password" placeholder="password" />
    <div class="cf-turnstile" data-sitekey="0x4AAAAAAAf0FyMdm_H6AFYJ"></div>
    <button type="submit" value="Submit">Log in</button>
  </form>


  <p>Original photo <a href="https://unsplash.com/photos/a-close-up-of-a-metal-object-with-numbers-on-it-eNxYF6cexYU">Unsplash</a></p>
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" defer></script>
</body>

</html>
